name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Composer Dependencies
      run: |
        composer config policy.advisories.block false
        composer install --no-dev --optimize-autoloader
      working-directory: ./backend

    - name: Build Deployment Package
      run: |
        mkdir -p ftp-deploy/public

        # Create the zip (exclude .env, .git, node_modules)
        cd backend
        zip -rq ../ftp-deploy/deploy.zip . \
          -x ".git/*" \
          -x ".github/*" \
          -x "node_modules/*" \
          -x ".env" \
          -x ".env.*"
        cd ..

        # Copy the persistent unzip script (stored in .github/deploy, NOT in the zip)
        cp .github/deploy/unzip.php ftp-deploy/public/unzip.php

        echo "Package contents:"
        ls -la ftp-deploy/
        ls -la ftp-deploy/public/

    - name: Upload to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./ftp-deploy/
        server-dir: /api.smarttimes.in/
        dangerous-clean-slate: false

    - name: Trigger Extraction on Server
      run: |
        echo "Waiting 15s for FTP upload to fully complete..."
        sleep 15

        RESPONSE=$(curl -s -w "\n%{http_code}" https://api.smarttimes.in/unzip.php)
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n-1)

        echo "Server Response: $BODY"
        echo "HTTP Status Code: $HTTP_CODE"

        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "DEPLOYMENT FAILED: Server returned HTTP $HTTP_CODE"
          exit 1
        fi

        echo "Deployment completed successfully!"
