name: Deploy Backend (SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Composer Dependencies
      run: |
        composer config policy.advisories.block false
        composer install --no-dev --optimize-autoloader
      working-directory: ./backend

    - name: Create Deployment Package
      run: |
        cd backend
        zip -rq ../deploy.zip . \
          -x ".git/*" \
          -x ".github/*" \
          -x "node_modules/*" \
          -x ".env" \
          -x ".env.*"
        echo "Package ready: $(du -sh ../deploy.zip)"

    - name: Upload Package to Server via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "deploy.zip"
        target: "/home/smarttim/api.smarttimes.in/"

    - name: Extract & Setup on Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          cd /home/smarttim/api.smarttimes.in/

          echo "Extracting deployment package..."
          unzip -o deploy.zip -d .
          rm -f deploy.zip

          echo "Ensuring Laravel directories exist..."
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          echo "Setting permissions..."
          chmod -R 775 storage bootstrap/cache

          echo "Deployment completed at $(date)"
