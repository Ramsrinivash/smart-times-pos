name: Deploy Backend → Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'        # Only triggers when backend files change

jobs:
  deploy-backend:
    name: Deploy Laravel API to Railway
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, curl, openssl
          coverage: none

      - name: 📦 Install Composer Dependencies
        working-directory: backend
        run: |
          if [ -f composer.lock ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          else
            composer update --no-dev --optimize-autoloader --no-interaction
          fi

      - name: 🚀 Deploy to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx @railway/cli up --service smart-times-backend --detach
