name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Prepare Bootstrap Cache
      run: |
        mkdir -p bootstrap/cache
        chmod -R 775 bootstrap/cache
      working-directory: ./backend

    - name: Install Composer Dependencies
      run: |
        composer config policy.advisories.block false
        composer install --no-dev --optimize-autoloader
      working-directory: ./backend

    - name: Prepare Deployment Files
      run: |
        mkdir -p ../ftp-deploy/public
        zip -rq ../ftp-deploy/deploy.zip . -x ".git/*" ".github/*" "node_modules/*" ".env*"
        cat << 'PHPEOF' > ../ftp-deploy/public/unzip.php
<?php
$basePath = dirname(__DIR__) . '/';
$zipFile  = $basePath . 'deploy.zip';

if (!file_exists($zipFile)) {
    http_response_code(404);
    echo json_encode(['status' => 'error', 'message' => 'deploy.zip not found at ' . $zipFile]);
    exit;
}

$zip = new ZipArchive;
$opened = $zip->open($zipFile);

if ($opened === TRUE) {
    $zip->extractTo($basePath);
    $zip->close();

    // Ensure required Laravel directories exist with correct permissions
    $directories = [
        'storage/app/public',
        'storage/framework/cache/data',
        'storage/framework/sessions',
        'storage/framework/testing',
        'storage/framework/views',
        'storage/logs',
        'bootstrap/cache'
    ];
    foreach ($directories as $dir) {
        $dirPath = $basePath . $dir;
        if (!is_dir($dirPath)) {
            mkdir($dirPath, 0775, true);
        }
    }

    // Clean up zip only — keep this file for next deployment
    unlink($zipFile);

    http_response_code(200);
    echo json_encode(['status' => 'success', 'message' => 'Extracted successfully at ' . date('Y-m-d H:i:s')]);
} else {
    http_response_code(500);
    echo json_encode(['status' => 'error', 'message' => 'Failed to open zip. Code: ' . $opened]);
}
?>
PHPEOF
      working-directory: ./backend

    - name: Upload to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./ftp-deploy/
        server-dir: /api.smarttimes.in/
        dangerous-clean-slate: false

    - name: Trigger Extraction on Server
      run: |
        echo "Waiting for FTP sync to complete..."
        sleep 10
        RESPONSE=$(curl -s -w "\n%{http_code}" https://api.smarttimes.in/unzip.php)
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n-1)
        echo "Response: $BODY"
        echo "HTTP Code: $HTTP_CODE"
        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "ERROR: Extraction failed with HTTP $HTTP_CODE"
          exit 1
        fi
        echo "Deployment successful!"
